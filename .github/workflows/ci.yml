name: Fullstack checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: npm run db:check
      - run: npm run generate && git diff --exit-code -- backend/drizzle
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:db
